services:
  postgres:
    image: postgres:16-alpine
    container_name: qualipilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qualipilot
      POSTGRES_PASSWORD: qualipilot
      POSTGRES_DB: qualipilot
    ports:
      - "5432:5432"
    volumes:
      - qualipilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualipilot -d qualipilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qualipilot_postgres_data:
